<!DOCTYPE html>
<html lang="en">

<head>
    <title>{{title}}</title>
    <meta charSet="utf-8" />
    <link rel="alternate" type="application/rss+xml" href="{{rss_feed_url}}" title="RSS 2.0" />
    <meta name="description"
        content="Andor Polgar's (mostly) visual journal: here, you'll find my photography projects and random snapshots from my life." />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=5, minimum-scale=1, user-scalable=yes" />
    <style>
        @font-face {
            font-family: "Ark Pixel 12px Mono";
            src: url("https://cdn.polgarand.org/fonts/ark-pixel-12px-monospaced-latin.woff2") format("woff2");
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: "Ark Pixel 16px Mono";
            src: url("https://cdn.polgarand.org/fonts/ark-pixel-16px-monospaced-latin.woff2") format("woff2");
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: "Ark Pixel 12px Mono Fallback";
            src: local("Courier New"), local("Liberation Mono");
            font-style: normal;
            font-weight: 400;
            size-adjust: 83.3333%;
            ascent-override: 99.6%;
            descent-override: 20.4%;
            line-gap-override: 0%;
        }

        @font-face {
            font-family: "Ark Pixel 16px Mono Fallback";
            src: local("Courier New"), local("Liberation Mono");
            font-style: normal;
            font-weight: 400;
            size-adjust: 83.3333%;
            ascent-override: 97.2%;
            descent-override: 22.8%;
            line-gap-override: 0%;
        }
    </style>
    <link rel="stylesheet" href="/assets/{{style.scss}}" />
    <link rel="canonical" href="{{site_url}}/{{pathname}}" />
    <link rel="icon" href="/assets/{{favicon.ico}}" />
    {% if page_specific_css %}
    <link rel="stylesheet" href="/assets/{{page_specific_css}}" class="page-specific-css">
    {% endif %}
</head>

<body>
    <img src="https://cdn.polgarand.org/dvd_logo.gif" class="pixelated" alt="DVD logo" id="dvd-logo"
        draggable="false" />
    <img src="https://cdn.polgarand.org/templeos-elephant.gif" class="pixelated" alt="TempleOS elephant"
        id="templeos-elephant" draggable="false" />
    <img src="https://cdn.polgarand.org/amiga_boing_ball.gif" class="pixelated" id="amiga-boing-ball"
        draggable="false" />
    <nav class="desktop">
        {% for item in data.desktop %}
        <a href="{{item.href}}" class="icon" draggable="false" {% if item.target %}target="{{item.target}}" {% endif %}>
            <div class="icon-picture">
                <img src="https://cdn.polgarand.org/windows/32x32/{{item.icon}}" class="pixelated" width="64px"
                    height="64px" draggable="false" />
                {% if item.target %}<img class="shortcut pixelated"
                    src="https://cdn.polgarand.org/windows/32x32/overlay_shortcut.gif" width="64px" height="64px"
                    draggable="false" />{%
                endif %}
            </div>
            <div class="icon-label">{{item.label}}</div>
        </a>
        {% endfor %}
    </nav><!-- .desktop -->

    <div id="clippy" class="window">
        {% render dialogheader.liquid title:"Clippy" %}
        <div class="hole content-hole">
            <img width="248" height="184" id="clippy-gif" class="pixelated"
                src="https://cdn.polgarand.org/clippy/startup.gif"
                style="background-image: url('https://cdn.polgarand.org/clippy/clippy_bg.gif')" alt="Clippy"
                draggable="false" />
        </div>
    </div>

    <div class="container">
        <main class="window main">
            {% render windowheader.liquid title:"Andornet Explorer" %}
            <div class="hole content-hole">
                <div class="head">
                    <div class="button" id="button-back" data-nosnippet>
                        <div class="icon">⬅️</div>
                        <div class="label">Back</div>
                    </div>
                    <div class="button" id="button-forward" data-nosnippet>
                        <div class="icon">➡️</div>
                        <div class="label">Forward</div>
                    </div>
                    <div class="button" id="button-reload" data-nosnippet>
                        <div class="icon">🔄</div>
                        <div class="label">Reload</div>
                    </div>
                    <a href="/" class="button" data-nosnippet>
                        <div class="icon">🏠</div>
                        <div class="label">Home</div>
                    </a>
                    <img class="netscape-logo pixelated"
                        src="https://cdn.polgarand.org/netscape/netscape-meteors-60.gif" width="120px" height="120px"
                        draggable="false" />
                </div>
                <div class="content">
                    {{body}}
                </div>
            </div>
            <div class="corner">
            </div>
            <div class="corner-inner">
            </div>
            <div class="bars">
                <div class="bar">
                </div>
                <div class="bar">
                </div>
                <div class="bar">
                </div>
            </div>
        </main>
    </div><!-- .container -->
    <script src="/assets/{{script.ts}}" defer></script>
    <script src="/assets/{{dvd.ts}}" defer></script>
    <script src="/assets/{{amigaboingball.ts}}" defer></script>
    <script src="/assets/{{templeoselephant.ts}}" defer></script>
    <script src="/assets/{{clippy.ts}}" defer></script>
</body>

</html>
